name: Build Snake IO by Ashish v6.1 Clean UI APK

on:
  workflow_dispatch:
  push:
    branches: [snake-arena-apk-build]
    paths:
      - 'snake-arena-v3/apply_v61_ui_cleanup.py'
      - 'snake-arena-v3/v61_ui_cleanup.css'
      - 'snake-arena-v3/v61_ui_cleanup.js'
      - '.github/workflows/build-snake-io-v6.1-clean-ui.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate v6.1 game
        run: |
          python3 snake-arena-v3/fix_v47_patch_driver.py
          python3 snake-arena-v3/apply_multiplayer_patch.py
          python3 snake-arena-v3/apply_multiplayer_loot_fix.py
          python3 snake-arena-v3/apply_v44_smooth_patch.py
          python3 snake-arena-v3/apply_v45_controls_world_patch.py
          python3 snake-arena-v3/apply_v46_android_runtime_fix.py
          python3 snake-arena-v3/apply_v47_online_multiplayer.py
          python3 snake-arena-v3/apply_v48_food_radar_fix.py
          python3 snake-arena-v3/apply_v49_magnet_balance.py
          python3 snake-arena-v3/apply_v50_stable_release.py
          python3 snake-arena-v3/prepare_v51_zonal_targets.py
          python3 snake-arena-v3/apply_v51_zonal_mode.py
          python3 snake-arena-v3/apply_v51_test_hooks.py
          python3 snake-arena-v3/apply_v52_simple_ui.py
          python3 snake-arena-v3/apply_v53_bot_battle_growth.py
          python3 snake-arena-v3/apply_v60_adventure_ui.py
          python3 snake-arena-v3/apply_v61_ui_cleanup.py

      - name: Static UI audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/game-multiplayer.html').read_text()
          required=[
            'function advV61RebuildHome()', 'function advV61Start(mode,kids)',
            'window.__v61UiAudit=function()', '.advMainActions .advAction{display:none!important}',
            'PLAY CLASSIC','PLAY ZONAL','PLAY EASY',
            'ONLINE ROOM','WI-FI / HOTSPOT','BLUETOOTH',
            'SNAKE SKINS','UPGRADES','THEMES & ITEMS',
            'Jungle Garden','Candy Land','Ocean Reef','Desert Ruins','Snow World','Space Neon',
            'while(snakes.length>50)snakes.pop()','value*1.28',
            'const magnetBonus=this.isPlayer?10+Math.max(0,magnetLevel-1)*7:0;',
            '<script src="peerjs.min.js"></script>'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('v6.1 static audit failed: '+', '.join(missing))
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          Path('/tmp/snake-game-v61.js').write_text('\n'.join(s for s in scripts if s.strip()))
          print('V61_STATIC_OK')
          PY
          node --check /tmp/snake-game-v61.js

      - name: Install UI test dependencies
        run: npm install --no-save jsdom@24 peerjs@1.5.5 >/dev/null

      - name: Runtime UI tests at phone and tablet sizes
        shell: bash
        run: |
          cat > smoke-v61.cjs <<'EOF'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const html=fs.readFileSync('/tmp/game-multiplayer.html','utf8');
          const noop=()=>{},gradient={addColorStop:noop};
          const makeCtx=()=>new Proxy({canvas:{width:1280,height:720},measureText:t=>({width:String(t).length*7}),createLinearGradient:()=>gradient,createRadialGradient:()=>gradient,createPattern:()=>null,getImageData:()=>({data:new Uint8ClampedArray(4)}),save:noop,restore:noop,beginPath:noop,closePath:noop,moveTo:noop,lineTo:noop,arc:noop,rect:noop,clip:noop,stroke:noop,fill:noop,fillRect:noop,clearRect:noop,drawImage:noop,fillText:noop,setTransform:noop,translate:noop,rotate:noop,scale:noop,strokeRect:noop},{get:(o,p)=>p in o?o[p]:noop,set:(o,p,v)=>(o[p]=v,true)});
          class FakeConn{constructor(peer){this.peer=peer;this.open=false;this.h={};setTimeout(()=>{this.open=true;this.emit('open')},8)}on(n,f){(this.h[n]||(this.h[n]=[])).push(f);return this}emit(n,v){(this.h[n]||[]).forEach(f=>f(v))}send(v){this.lastSent=v}close(){if(!this.open)return;this.open=false;this.emit('close')}}
          let seq=0;class FakePeer{constructor(id){this.id=id||('fake-'+(++seq));this.h={};setTimeout(()=>this.emit('open',this.id),8)}on(n,f){(this.h[n]||(this.h[n]=[])).push(f);return this}emit(n,v){(this.h[n]||[]).forEach(f=>f(v))}connect(id){return new FakeConn(id)}destroy(){}}
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function runSize(width,height){
            const errors=[];const vc=new VirtualConsole();vc.on('jsdomError',e=>{if(!String(e.message).includes('Could not load script'))errors.push('jsdomError: '+e.message)});vc.on('error',(...a)=>errors.push('console.error: '+a.join(' ')));
            const ctx=makeCtx();const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,url:'https://local.snake/',virtualConsole:vc,beforeParse(w){Object.defineProperty(w,'innerWidth',{value:width,writable:true});Object.defineProperty(w,'innerHeight',{value:height,writable:true});Object.defineProperty(w,'devicePixelRatio',{value:1,writable:true});w.HTMLCanvasElement.prototype.getContext=function(){return ctx};w.HTMLCanvasElement.prototype.setPointerCapture=noop;w.HTMLCanvasElement.prototype.releasePointerCapture=noop;w.HTMLElement.prototype.setPointerCapture=noop;w.HTMLElement.prototype.releasePointerCapture=noop;if(!w.PointerEvent)w.PointerEvent=w.MouseEvent;w.Peer=FakePeer;}});
            const w=dom.window;w.addEventListener('error',e=>errors.push('window.error: '+(e.error?.stack||e.message)));w.addEventListener('unhandledrejection',e=>errors.push('rejection: '+String(e.reason)));
            await sleep(250);if(errors.length)throw new Error(errors.join('\n'));await sleep(2200);
            const audit=w.__v61UiAudit();if(!audit.ok)throw new Error('UI audit failed '+JSON.stringify(audit));
            const home=w.document.querySelector('#advHome');if(!home)throw new Error('Home missing');
            if(home.querySelectorAll('#advPlay').length!==1)throw new Error('Play duplicated');
            if(home.querySelectorAll('.advSettingsTop').length!==1)throw new Error('Settings duplicated');
            if(home.querySelectorAll('.advWidget').length!==1)throw new Error('Daily widget duplicated');
            if(home.querySelectorAll('.advAction').length!==0)throw new Error('Old quick actions remain');
            w.advOpenPanel('modes');await sleep(10);let body=w.document.querySelector('#advPanelBody');if(body.querySelectorAll('.advModeCard').length!==3)throw new Error('Modes should be exactly 3');if(/ONLINE ROOM|WI-FI|BLUETOOTH/.test(body.textContent))throw new Error('Multiplayer duplicated in Modes');
            w.advOpenPanel('shop');await sleep(10);body=w.document.querySelector('#advPanelBody');if(body.querySelectorAll('.advShopCard').length!==3)throw new Error('Shop should be exactly 3 categories');if(/DAILY REWARD|QUEST REWARD/.test(body.textContent))throw new Error('Daily/Quest repeated inside Shop');
            w.advOpenPanel('friends');await sleep(10);body=w.document.querySelector('#advPanelBody');if(body.querySelectorAll('.advFriendBtns button').length!==3)throw new Error('Friends needs exactly 3 transports');
            w.advOpenPanel('arena');await sleep(10);body=w.document.querySelector('#advPanelBody');if(body.querySelectorAll('.advArenaCard').length!==6)throw new Error('Arena selector must have 6 cards');
            w.advV61Start('infinite',false);await sleep(150);let st=w.__v51State();if(st.mode!=='infinite'||st.zoneActive)throw new Error('Classic start failed '+JSON.stringify(st));if(typeof w.__v53BotTuningTest!=='function'||!w.__v53BotTuningTest())throw new Error('Bot tuning regressed');
            w.quitToLobby();await sleep(760);w.advV61Start('zonal',false);await sleep(150);st=w.__v51State();if(st.mode!=='zonal'||!st.zoneActive||st.totalSnakes!==50)throw new Error('Zonal start failed '+JSON.stringify(st));
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('V61_SIZE_OK '+width+'x'+height);w.close();
          }
          (async()=>{await runSize(860,390);await runSize(1280,720);console.log('V61_CLEAN_UI_RUNTIME_OK')})().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          EOF
          node smoke-v61.cjs

      - name: Generate Android project
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          wf=yaml.safe_load(Path('.github/workflows/build-snake-arena-v4-multiplayer.yml').read_text())
          block=next(s['run'] for s in wf['jobs']['build']['steps'] if s.get('name')=='Create Android project')
          subprocess.run(block,shell=True,executable='/bin/bash',check=True)
          PY
          cp /tmp/game-multiplayer.html app/src/main/assets/game.html
          cp node_modules/peerjs/dist/peerjs.min.js app/src/main/assets/peerjs.min.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/snakearena/game/MainActivity.java');s=p.read_text();needle='settings.setAllowFileAccess(true);'
          if needle not in s: raise SystemExit('WebView settings target missing')
          s=s.replace(needle,needle+'\n                  settings.setAllowFileAccessFromFileURLs(true);\n                  settings.setAllowUniversalAccessFromFileURLs(true);',1);p.write_text(s)
          strings=Path('app/src/main/res/values/strings.xml')
          if strings.exists(): strings.write_text(strings.read_text().replace('Snake Arena IO','Snake IO by Ashish'))
          PY
          sed -i "s/versionCode 17/versionCode 31/" app/build.gradle
          sed -i "s/versionName '4.2.0'/versionName '6.1.0'/" app/build.gradle

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package and verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Snake-IO-by-Ashish-v6.1-clean-ui.apk
          unzip -t Snake-IO-by-Ashish-v6.1-clean-ui.apk >/dev/null
          unzip -l Snake-IO-by-Ashish-v6.1-clean-ui.apk | grep -q 'assets/peerjs.min.js'
          test -s Snake-IO-by-Ashish-v6.1-clean-ui.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-IO-by-Ashish-v6.1-Clean-UI-APK
          path: Snake-IO-by-Ashish-v6.1-clean-ui.apk
          if-no-files-found: error
