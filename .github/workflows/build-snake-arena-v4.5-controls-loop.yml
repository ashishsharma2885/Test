name: Build Snake Arena v4.5 Controls Loop APK

on:
  push:
    branches:
      - snake-arena-apk-build
    paths:
      - 'snake-arena-v3/apply_v45_controls_world_patch.py'
      - '.github/workflows/build-snake-arena-v4.5-controls-loop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply multiplayer smooth controls and world patches
        run: |
          python3 snake-arena-v3/apply_multiplayer_patch.py
          python3 snake-arena-v3/apply_multiplayer_loot_fix.py
          python3 snake-arena-v3/apply_v44_smooth_patch.py
          python3 snake-arena-v3/apply_v45_controls_world_patch.py

      - name: Generate Android project
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          wf=yaml.safe_load(Path('.github/workflows/build-snake-arena-v4-multiplayer.yml').read_text())
          steps=wf['jobs']['build']['steps']
          block=next(s['run'] for s in steps if s.get('name')=='Create Android project')
          subprocess.run(block, shell=True, executable='/bin/bash', check=True)
          PY
          sed -i "s/versionCode 17/versionCode 20/" app/build.gradle
          sed -i "s/versionName '4.2.0'/versionName '4.5.0'/" app/build.gradle

      - name: Validate JavaScript and requested gameplay rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/game.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',html)
          if not scripts: raise SystemExit('No game script found')
          Path('/tmp/snake-game.js').write_text('\n'.join(scripts))
          required=[
            "joystickStyle:'floating'",
            'function setJoystickStyle(style)',
            'function beginFloatingJoystick(e)',
            'function positionFloatingJoystick(x,y)',
            "data.controls.handed==='right'?x>=W*.45:x<=W*.55",
            'min="0.65" max="1.55"',
            'this.spacing=4',
            'pathSteps=Math.max(1,Math.ceil(moveDistance/2.2))',
            'const wrap=function(v){return ((v%WORLD)+WORLD)%WORLD}',
            'function enforceLoopPosition(s)',
            'this.x=wrap(oldX+moveX);this.y=wrap(oldY+moveY);enforceLoopPosition(this)',
            'for(const attacker of snakes)',
            'this.eatNearby()',
            'spawnFood(p.x+rand(-9,9),p.y+rand(-9,9),1.55,true)',
            'function spawnRoomDeathLoot(victim)',
            "t:'death_loot'",
            'ROOM_BOTS=24',
            'PLAYER_START_LENGTH=3'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('v4.5 validation failed: '+', '.join(missing))
          if 'this.spacing=6' in html: raise SystemExit('Old loose snake spacing still present')
          print('v4.5 joystick, loop, bot combat/eating and death-food rules validated')
          PY
          node --check /tmp/snake-game.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Snake-Arena-IO-v4.5-controls-loop.apk
          unzip -t Snake-Arena-IO-v4.5-controls-loop.apk >/dev/null
          test -s Snake-Arena-IO-v4.5-controls-loop.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Arena-IO-v4.5-Controls-Loop-APK
          path: Snake-Arena-IO-v4.5-controls-loop.apk
          if-no-files-found: error
