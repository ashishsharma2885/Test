name: Build Snake Arena v4.6 Android Stable APK

on:
  workflow_dispatch:
  push:
    branches: [snake-arena-apk-build]
    paths:
      - 'snake-arena-v3/apply_v46_android_runtime_fix.py'
      - '.github/workflows/build-snake-arena-v4.6-android-stable.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate fixed game
        run: |
          python3 snake-arena-v3/apply_multiplayer_patch.py
          python3 snake-arena-v3/apply_multiplayer_loot_fix.py
          python3 snake-arena-v3/apply_v44_smooth_patch.py
          python3 snake-arena-v3/apply_v45_controls_world_patch.py
          python3 snake-arena-v3/apply_v46_android_runtime_fix.py

      - name: Validate JavaScript syntax and required fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/game-multiplayer.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',html)
          if not scripts: raise SystemExit('No game script found')
          js='\n'.join(scripts)
          Path('/tmp/snake-game.js').write_text(js)
          required=[
            'Never read runtime joystick state here',
            'function beginFloatingJoystick(e)',
            'function positionFloatingJoystick(x,y)',
            "joystickStyle:'floating'",
            'function enforceLoopPosition(s)',
            'this.spacing=4',
            'function spawnRoomDeathLoot(victim)',
            "t:'death_loot'",
            'ROOM_BOTS=24',
            'PLAYER_START_LENGTH=3',
            'const ranked=snakes.slice()'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('v4.6 structure validation failed: '+', '.join(missing))
          bad="if(!joystick.active)joy.style.display='none'"
          if bad in html: raise SystemExit('Critical v4.5 joystick TDZ bug still present')
          print('v4.6 static structure validated')
          PY
          node --check /tmp/snake-game.js

      - name: Runtime smoke test
        shell: bash
        run: |
          npm install --no-save jsdom@24 >/dev/null
          cat > smoke.cjs <<'EOF'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const html=fs.readFileSync('/tmp/game-multiplayer.html','utf8');
          const errors=[];const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push('jsdomError: '+e.message));
          vc.on('error',(...a)=>errors.push('console.error: '+a.join(' ')));
          const noop=()=>{},gradient={addColorStop:noop};
          const ctx=new Proxy({canvas:{width:1280,height:720},measureText:t=>({width:String(t).length*7}),createLinearGradient:()=>gradient,createRadialGradient:()=>gradient,createPattern:()=>null,getImageData:()=>({data:new Uint8ClampedArray(4)}),save:noop,restore:noop,beginPath:noop,closePath:noop,moveTo:noop,lineTo:noop,arc:noop,rect:noop,clip:noop,stroke:noop,fill:noop,fillRect:noop,clearRect:noop,drawImage:noop,fillText:noop,setTransform:noop,translate:noop,rotate:noop,scale:noop},{get:(o,p)=>p in o?o[p]:noop,set:(o,p,v)=>(o[p]=v,true)});
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,url:'https://local.snake/',virtualConsole:vc,beforeParse(w){
            Object.defineProperty(w,'innerWidth',{value:900,writable:true});Object.defineProperty(w,'innerHeight',{value:420,writable:true});Object.defineProperty(w,'devicePixelRatio',{value:1,writable:true});
            w.HTMLCanvasElement.prototype.getContext=function(){return ctx};w.HTMLCanvasElement.prototype.setPointerCapture=noop;w.HTMLCanvasElement.prototype.releasePointerCapture=noop;w.HTMLElement.prototype.setPointerCapture=noop;w.HTMLElement.prototype.releasePointerCapture=noop;if(!w.PointerEvent)w.PointerEvent=w.MouseEvent;
          }});
          const w=dom.window;w.addEventListener('error',e=>errors.push('window.error: '+(e.error?.stack||e.message)));w.addEventListener('unhandledrejection',e=>errors.push('rejection: '+String(e.reason)));const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            await sleep(350);if(errors.length)throw new Error(errors.join('\n'));
            const play=w.document.querySelector('.playBtn');if(!play)throw new Error('PLAY button missing');play.click();await sleep(450);
            if(!w.document.querySelector('#gameScreen.active'))throw new Error('Game screen did not open');
            const canvas=w.document.querySelector('#game');const joy=w.document.querySelector('#joystick');
            canvas.dispatchEvent(new w.PointerEvent('pointerdown',{clientX:120,clientY:300,bubbles:true,pointerId:7}));await sleep(80);if(!joy||joy.style.display==='none')throw new Error('Floating joystick did not appear');
            canvas.dispatchEvent(new w.PointerEvent('pointermove',{clientX:160,clientY:270,bubbles:true,pointerId:7}));canvas.dispatchEvent(new w.PointerEvent('pointerup',{clientX:160,clientY:270,bubbles:true,pointerId:7}));await sleep(100);
            for(let i=0;i<3;i++){w.restartMatch();await sleep(360);if(!w.document.querySelector('#gameScreen.active'))throw new Error('Restart failed at '+i)}
            w.quitToLobby();await sleep(450);if(!w.document.querySelector('#lobby.active'))throw new Error('Lobby return failed');
            play.click();await sleep(400);if(!w.document.querySelector('#gameScreen.active'))throw new Error('Second match failed');
            w.quitToLobby();await sleep(400);if(errors.length)throw new Error(errors.join('\n'));
            console.log('ANDROID_GAME_RUNTIME_SMOKE_OK');w.close();
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1;w.close()});
          EOF
          node smoke.cjs

      - name: Generate Android project
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          wf=yaml.safe_load(Path('.github/workflows/build-snake-arena-v4-multiplayer.yml').read_text())
          block=next(s['run'] for s in wf['jobs']['build']['steps'] if s.get('name')=='Create Android project')
          subprocess.run(block,shell=True,executable='/bin/bash',check=True)
          PY
          cp /tmp/game-multiplayer.html app/src/main/assets/game.html
          sed -i "s/versionCode 17/versionCode 21/" app/build.gradle
          sed -i "s/versionName '4.2.0'/versionName '4.6.0'/" app/build.gradle

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Snake-Arena-IO-v4.6-android-stable.apk
          unzip -t Snake-Arena-IO-v4.6-android-stable.apk >/dev/null
          test -s Snake-Arena-IO-v4.6-android-stable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Arena-IO-v4.6-Android-Stable-APK
          path: Snake-Arena-IO-v4.6-android-stable.apk
          if-no-files-found: error
