name: Build Snake Arena Better APK

on:
  push:
    branches:
      - snake-arena-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/snakearena/game
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SnakeArenaV2'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.snakearena.game'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.snakearena.game'
                  minSdk 24
                  targetSdk 35
                  versionCode 6
                  versionName '2.4.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Snake Arena IO"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#04101B</item>
                  <item name="android:statusBarColor">#04101B</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_bg">#061827</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- bright fruit -->
              <path android:fillColor="#FFD54A"
                  android:pathData="M27,31 m-10,0 a10,10 0,1 0,20 0 a10,10 0,1 0,-20,0"/>
              <path android:fillColor="#70F0A5"
                  android:pathData="M28,20 C31,14 38,13 42,16 C38,21 34,24 29,24 Z"/>
              <!-- snake body -->
              <path android:fillColor="#54E7FF"
                  android:pathData="M82,28 C69,14 47,16 35,28 C25,38 27,53 39,60 C49,66 62,63 68,70 C74,77 65,87 54,87 C43,87 35,81 31,73 L20,79 C27,96 46,103 63,98 C80,93 91,80 87,66 C83,52 70,48 58,48 C48,48 42,47 40,42 C38,36 44,30 52,28 C61,25 69,29 74,35 Z"/>
              <!-- snake head highlight -->
              <path android:fillColor="#8BF4FF"
                  android:pathData="M74,24 C80,27 84,32 85,38 C81,34 77,32 72,31 Z"/>
              <!-- eye -->
              <path android:fillColor="#FFFFFF"
                  android:pathData="M72,29 m-4,0 a4,4 0,1 0,8 0 a4,4 0,1 0,-8,0"/>
              <path android:fillColor="#07131C"
                  android:pathData="M73,29 m-1.6,0 a1.6,1.6 0,1 0,3.2 0 a1.6,1.6 0,1 0,-3.2,0"/>
              <!-- tongue -->
              <path android:strokeColor="#FF6B7A" android:strokeWidth="2.4"
                  android:strokeLineCap="round" android:fillColor="@android:color/transparent"
                  android:pathData="M84,38 L94,38 M94,38 L99,34 M94,38 L99,42"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#061827" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#12344C" android:pathData="M7,7h94v94h-94z"/>
              <path android:fillColor="#FFD54A" android:pathData="M27,31 m-10,0 a10,10 0,1 0,20 0 a10,10 0,1 0,-20,0"/>
              <path android:fillColor="#70F0A5" android:pathData="M28,20 C31,14 38,13 42,16 C38,21 34,24 29,24 Z"/>
              <path android:fillColor="#54E7FF" android:pathData="M82,28 C69,14 47,16 35,28 C25,38 27,53 39,60 C49,66 62,63 68,70 C74,77 65,87 54,87 C43,87 35,81 31,73 L20,79 C27,96 46,103 63,98 C80,93 91,80 87,66 C83,52 70,48 58,48 C48,48 42,47 40,42 C38,36 44,30 52,28 C61,25 69,29 74,35 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M72,29 m-4,0 a4,4 0,1 0,8 0 a4,4 0,1 0,-8,0"/>
          </vector>
          EOF

          cp app/src/main/res/mipmap-anydpi/ic_launcher.xml app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > app/src/main/java/com/snakearena/game/MainActivity.java <<'EOF'
          package com.snakearena.game;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              @SuppressLint("SetJavaScriptEnabled")
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  immersive();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setBackgroundColor(0xFF04101B);
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);
                  webView.setLongClickable(false);
                  webView.setHapticFeedbackEnabled(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/game.html");
              }

              private void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              @Override
              protected void onPause() {
                  if (webView != null) {
                      webView.evaluateJavascript("window.snakeAppPause&&window.snakeAppPause()", null);
                      webView.onPause();
                      webView.pauseTimers();
                  }
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) {
                      webView.resumeTimers();
                      webView.onResume();
                      webView.evaluateJavascript("window.snakeAppResume&&window.snakeAppResume()", null);
                  }
                  immersive();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) immersive();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/assets/game.html <<'EOF'
          <!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <meta name="theme-color" content="#04101b">
          <title>Snake Arena IO</title>
          <style>
          :root{--cyan:#55e9ff;--gold:#ffd45e;--glass:rgba(3,13,23,.74)}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04101b;font-family:Arial,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
          canvas{display:block;width:100vw;height:100vh}
          #ui{position:fixed;inset:0;pointer-events:none}
          .glass{background:var(--glass);border:1px solid rgba(255,255,255,.09);border-radius:15px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
          #stats{position:absolute;left:10px;top:10px;padding:9px 12px;font-size:11px;line-height:1.55;min-width:135px}
          #stats .title{font-size:13px;font-weight:900;color:#ecfbff;margin-bottom:2px}
          #leader{position:absolute;right:10px;top:10px;width:166px;padding:9px 11px;font-size:10px}
          #leader .title{font-size:10px;font-weight:900;letter-spacing:.11em;color:#c5d9e8;margin-bottom:5px}
          #list{padding-left:17px;margin:0;line-height:1.45}
          #radarWrap{position:absolute;left:14px;bottom:145px;padding:6px}
          #radarWrap:before{content:"LIVE MAP";display:block;text-align:center;font-size:8px;font-weight:900;letter-spacing:.12em;color:rgba(220,245,255,.65);margin-bottom:4px}
          #radar{width:92px;height:92px;border-radius:10px;display:block;background:rgba(0,0,0,.22)}
          #joystick{position:absolute;left:18px;bottom:18px;width:116px;height:116px;border-radius:50%;pointer-events:auto;touch-action:none;user-select:none;background:radial-gradient(circle at 42% 38%,rgba(98,223,255,.19),rgba(12,44,67,.48));border:2px solid rgba(255,255,255,.17);box-shadow:inset 0 0 26px rgba(72,217,255,.08),0 10px 30px rgba(0,0,0,.25)}
          #joystick:before{content:"MOVE";position:absolute;left:0;right:0;top:13px;text-align:center;font-size:9px;font-weight:900;letter-spacing:.13em;color:rgba(220,245,255,.55)}
          #stick{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#8df3ff,#2e9fc8 58%,#16637f);border:2px solid rgba(255,255,255,.42);box-shadow:0 5px 16px rgba(0,0,0,.35),inset 0 2px 6px rgba(255,255,255,.25);transition:box-shadow .1s}
          #joystick.active #stick{box-shadow:0 3px 14px rgba(67,220,255,.48),inset 0 2px 6px rgba(255,255,255,.28)}
          #boostBtn{position:absolute;right:20px;bottom:20px;width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(111,229,255,.58),rgba(26,112,255,.33));border:2px solid rgba(255,255,255,.28);font-size:12px;font-weight:900;letter-spacing:.05em;pointer-events:auto;user-select:none;box-shadow:0 8px 30px rgba(45,160,255,.25)}
          #boostBtn.active{transform:scale(.95);background:radial-gradient(circle at 35% 30%,rgba(125,255,190,.7),rgba(24,141,255,.48))}
          #energy{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);width:34vw;max-width:330px;height:9px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
          #bar{height:100%;width:100%;background:linear-gradient(90deg,#71f3ae,#55e9ff)}
          #start,#dead,#pause{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(10,35,55,.5),rgba(1,6,10,.88));pointer-events:auto}
          #dead,#pause{display:none}
          .card{width:min(430px,88vw);padding:24px;text-align:center;background:rgba(5,20,33,.96);border:1px solid rgba(255,255,255,.1);border-radius:21px;box-shadow:0 25px 80px rgba(0,0,0,.45)}
          .eyebrow{font-size:10px;letter-spacing:.18em;color:#65e9ff;font-weight:900;text-transform:uppercase}
          h1{margin:7px 0 8px;font-size:30px}
          .card p{font-size:12px;color:#b7cad9;line-height:1.55;margin:7px 0}
          .scoreBig{font-size:31px;font-weight:900;color:var(--gold);margin:12px 0 2px}
          button{border:0;border-radius:12px;padding:12px 20px;margin-top:13px;font-size:14px;font-weight:900;background:linear-gradient(135deg,#62ebff,#76f1aa);color:#02131a}
          @media(max-height:420px){
            #stats{font-size:10px;padding:7px 9px}
            #leader{font-size:9px;width:150px;padding:7px 9px}
            #boostBtn{width:74px;height:74px;right:16px;bottom:16px}
            #joystick{width:98px;height:98px;left:14px;bottom:14px}
            #stick{width:44px;height:44px}
            #radarWrap{left:12px;bottom:118px}
            #radar{width:76px;height:76px}
            #energy{bottom:10px}
          }
          </style>
          </head>
          <body>
          <canvas id="game"></canvas>
          <div id="ui">
            <div id="stats" class="glass">
              <div class="title">🐍 Snake Arena IO</div>
              Score: <b id="score">0</b><br>
              Length: <b id="length">12</b><br>
              Rank: <b id="rank">-</b><br>
              Best: <b id="best">0</b>
            </div>
            <div id="leader" class="glass">
              <div class="title">LEADERBOARD</div>
              <ol id="list"></ol>
            </div>
            <div id="radarWrap" class="glass"><canvas id="radar" width="120" height="120"></canvas></div>
            <div id="joystick"><div id="stick"></div></div>
            <div id="energy"><div id="bar"></div></div>
            <div id="boostBtn">BOOST</div>
            <div id="start">
              <div class="card">
                <div class="eyebrow">Endless Single Player v2.4</div>
                <h1>Snake Arena IO</h1>
                <p>Start small. Eat fruits to grow. Survive 50 respawning AI snakes. If your head hits another snake's body or tail, you die.</p>
                <p>Use the left joystick to steer and hold BOOST with your right thumb. The LIVE MAP follows your snake, keeps you in the center, and shows nearby AI snakes moving around you.</p>
                <button id="play">PLAY ENDLESS</button>
              </div>
            </div>
            <div id="dead">
              <div class="card">
                <div class="eyebrow">Run Over</div>
                <h1>You Crashed</h1>
                <div id="finalScore" class="scoreBig">0</div>
                <p>Collect fruit, grow bigger and try to reach rank #1.</p>
                <button id="again">PLAY AGAIN</button>
              </div>
            </div>
            <div id="pause">
              <div class="card">
                <div class="eyebrow">Paused</div>
                <h1>Game Paused</h1>
                <p>Your endless run is safe.</p>
                <button id="resume">RESUME</button>
              </div>
            </div>
          </div>
          <script>
          (()=>{'use strict';

          const canvas=document.getElementById('game');
          const ctx=canvas.getContext('2d',{alpha:false});
          const radar=document.getElementById('radar');
          const rctx=radar.getContext('2d');
          const $=id=>document.getElementById(id);

          let W=innerWidth,H=innerHeight,DPR=1,last=performance.now();
          let started=false,paused=false,boost=false;
          let bestScore=Number(localStorage.getItem('snakeArenaBestV2')||0);
          $('best').textContent=bestScore;

          function resize(){
            DPR=Math.min(devicePixelRatio||1,1.75);
            W=innerWidth;H=innerHeight;
            canvas.width=Math.max(1,Math.round(W*DPR));
            canvas.height=Math.max(1,Math.round(H*DPR));
            canvas.style.width=W+'px';
            canvas.style.height=H+'px';
            ctx.setTransform(DPR,0,0,DPR,0,0);
          }
          addEventListener('resize',resize);
          resize();

          const WORLD=7600;
          const FOOD_TARGET=1350;
          const MAX_FOOD=2300;
          const BOTS=50;
          const BASE_SPEED=146;
          const BOOST_SPEED=236;
          const MIN_LENGTH=10;
          const FOOD_CELL=190;
          const BODY_CELL=170;
          const FOOD_CELLS=Math.ceil(WORLD/FOOD_CELL);
          const BODY_CELLS=Math.ceil(WORLD/BODY_CELL);
          const FRUIT_COLORS=['#ff6475','#ffad56','#ffe169','#64ef9b','#69d8ff','#a978ff','#ff7ec8'];
          const BOT_COLORS=['#ff6b6b','#7bdff2','#8aff80','#ff9f43','#c56cf0','#54a0ff','#00d2d3','#feca57','#74b9ff','#fd79a8'];
          const BOT_NAMES=['Nova','Viper','Rex','Comet','Blaze','Echo','Bolt','Luna','Dash','Venom','Titan','Skye','Astro','Cobra','Ghost','Turbo','Spark','Neon','Hunter','Raptor','Flash','Cosmo','Matrix','Volt','Drift','Hydra','Orbit','Frost','Rocket','Pulse'];

          const rand=(a,b)=>Math.random()*(b-a)+a;
          const wrap=v=>((v%WORLD)+WORLD)%WORLD;
          function delta(a,b){let d=b-a;if(d>WORLD/2)d-=WORLD;if(d<-WORLD/2)d+=WORLD;return d}
          function distance(ax,ay,bx,by){return Math.hypot(delta(ax,bx),delta(ay,by))}
          function angleDiff(a,b){let d=(b-a+Math.PI)%(Math.PI*2)-Math.PI;return d<-Math.PI?d+Math.PI*2:d}
          function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
          function cellKey(x,y,size,count){
            let cx=Math.floor(wrap(x)/size)%count;
            let cy=Math.floor(wrap(y)/size)%count;
            if(cx<0)cx+=count;if(cy<0)cy+=count;
            return cx+','+cy;
          }
          function neighborBuckets(map,x,y,size,count,radiusCells){
            const out=[];
            let cx=Math.floor(wrap(x)/size)%count;
            let cy=Math.floor(wrap(y)/size)%count;
            for(let oy=-radiusCells;oy<=radiusCells;oy++){
              for(let ox=-radiusCells;ox<=radiusCells;ox++){
                let nx=(cx+ox)%count,ny=(cy+oy)%count;
                if(nx<0)nx+=count;if(ny<0)ny+=count;
                const bucket=map.get(nx+','+ny);
                if(bucket)out.push(bucket);
              }
            }
            return out;
          }

          let foods=[];
          let foodGrid=new Map();
          let bodyGrid=new Map();
          const snakes=[];
          const pointer={x:W*.7,y:H*.5,lastMove:0};
          const joystick={
            active:false,
            pointerId:null,
            x:0,
            y:0,
            lastAngle:0,
            max:39
          };

          function spawnFood(x=rand(0,WORLD),y=rand(0,WORLD),value=null,loot=false){
            let v=value,r;
            if(loot){
              v=v??2.6;
              r=rand(5.6,8.2);
            }else{
              const roll=Math.random();
              if(roll<.58){v=v??.7;r=rand(3.2,4.3)}
              else if(roll<.9){v=v??1.25;r=rand(4.5,5.8)}
              else{v=v??2.1;r=rand(6,7.4)}
            }
            foods.push({
              x:wrap(x),y:wrap(y),v:v,r:r,loot:loot,
              color:loot?'#ffd35a':FRUIT_COLORS[Math.random()*FRUIT_COLORS.length|0],
              alive:true,ttl:loot?45:1e9,phase:rand(0,Math.PI*2)
            });
          }
          for(let i=0;i<FOOD_TARGET;i++)spawnFood();

          function rebuildFoodGrid(){
            foodGrid=new Map();
            for(const f of foods){
              if(!f.alive)continue;
              const key=cellKey(f.x,f.y,FOOD_CELL,FOOD_CELLS);
              let bucket=foodGrid.get(key);
              if(!bucket){bucket=[];foodGrid.set(key,bucket)}
              bucket.push(f);
            }
          }

          function rebuildBodyGrid(){
            bodyGrid=new Map();
            for(const snake of snakes){
              if(!snake.alive)continue;
              for(let i=2;i<snake.segments.length;i+=2){
                const seg=snake.segments[i];
                const taper=1-(i/Math.max(1,snake.segments.length))*.25;
                const item={owner:snake,index:i,x:seg.x,y:seg.y,r:snake.radius*taper};
                const key=cellKey(seg.x,seg.y,BODY_CELL,BODY_CELLS);
                let bucket=bodyGrid.get(key);
                if(!bucket){bucket=[];bodyGrid.set(key,bucket)}
                bucket.push(item);
              }
            }
          }

          function safeSpawn(){
            for(let attempt=0;attempt<60;attempt++){
              const p={x:rand(0,WORLD),y:rand(0,WORLD)};
              let ok=true;
              for(const s of snakes){
                if(!s.alive)continue;
                if(distance(p.x,p.y,s.x,s.y)<260){ok=false;break}
                for(let i=4;i<s.segments.length;i+=7){
                  const g=s.segments[i];
                  if(distance(p.x,p.y,g.x,g.y)<90){ok=false;break}
                }
                if(!ok)break;
              }
              if(ok)return p;
            }
            return{x:rand(0,WORLD),y:rand(0,WORLD)};
          }

          class Snake{
            constructor(name,color,isPlayer=false){
              this.name=name;this.color=color;this.isPlayer=isPlayer;
              this.radius=10.5;this.spacing=6;
              this.turnRate=isPlayer?4.9:rand(2.5,3.5);
              this.cruise=rand(.97,1.03);
              this.ai={timer:0,target:null,bravery:Math.random()};
              this.score=0;this.respawn(true);
            }

            respawn(first=false){
              const p=safeSpawn();
              this.x=p.x;this.y=p.y;this.angle=rand(-Math.PI,Math.PI);
              this.alive=true;
              this.length=this.isPlayer?12:rand(16,30);
              this.energy=1;
              this.speed=BASE_SPEED;
              this.history=[];
              this.segments=[];
              this.ai.target=null;this.ai.timer=0;
              for(let i=0;i<150;i++)this.history.push({x:this.x,y:this.y});
              this.syncSegments();
              if(!first&&!this.isPlayer)this.score=0;
            }

            syncSegments(){
              const wanted=Math.floor(this.length);
              while(this.segments.length<wanted)this.segments.push({x:this.x,y:this.y});
              if(this.segments.length>wanted)this.segments.length=wanted;
            }

            grow(value){
              this.length+=value*1.8;
              this.score+=Math.round(value*12);
              this.syncSegments();
            }

            die(){
              if(!this.alive)return;
              this.alive=false;

              const maxDrops=90;
              const step=Math.max(2,Math.ceil(this.segments.length/maxDrops));
              for(let i=1;i<this.segments.length;i+=step){
                const p=this.segments[i];
                spawnFood(p.x+rand(-9,9),p.y+rand(-9,9),2.1,true);
              }

              if(this.isPlayer){
                bestScore=Math.max(bestScore,Math.floor(this.score));
                localStorage.setItem('snakeArenaBestV2',String(bestScore));
                $('best').textContent=bestScore;
                $('finalScore').textContent=Math.floor(this.score);
                $('dead').style.display='flex';
              }else{
                setTimeout(()=>{
                  if(!this.isPlayer&&!this.alive)this.respawn(false);
                },650+Math.random()*900);
              }
            }

            update(dt){
              if(!this.alive)return;
              if(this.isPlayer)this.updatePlayer(dt);
              else this.updateBot(dt);

              this.x=wrap(this.x+Math.cos(this.angle)*this.speed*dt);
              this.y=wrap(this.y+Math.sin(this.angle)*this.speed*dt);

              this.history.push({x:this.x,y:this.y});
              const required=Math.max(180,Math.floor(this.length*this.spacing+80));
              if(this.history.length>required+220){
                this.history.splice(0,Math.min(220,this.history.length-required));
              }

              this.syncSegments();
              for(let i=0;i<this.segments.length;i++){
                const offset=(i+1)*this.spacing;
                const idx=Math.max(0,this.history.length-1-offset);
                const p=this.history[idx]||this.history[0];
                this.segments[i].x=p.x;
                this.segments[i].y=p.y;
              }

              this.eatNearby();
            }

            updatePlayer(dt){
              let target=this.angle;
              const joyAmount=Math.hypot(joystick.x,joystick.y);

              if(joystick.active&&joyAmount>.12){
                joystick.lastAngle=Math.atan2(joystick.y,joystick.x);
                target=joystick.lastAngle;
              }else if(performance.now()-pointer.lastMove<1200){
                // Desktop mouse fallback only after a real recent mouse movement.
                target=Math.atan2(pointer.y-H/2,pointer.x-W/2);
                joystick.lastAngle=target;
              }else if(Number.isFinite(joystick.lastAngle)){
                // On phone, releasing the stick keeps the snake going in the chosen direction.
                target=joystick.lastAngle;
              }

              this.angle+=angleDiff(this.angle,target)*Math.min(1,this.turnRate*dt);
              if(boost&&this.energy>.02&&this.length>MIN_LENGTH){
                this.speed=BOOST_SPEED;
                this.energy=Math.max(0,this.energy-dt*.19);
              }else{
                this.speed=BASE_SPEED;
                this.energy=Math.min(1,this.energy+dt*.11);
              }
              $('bar').style.width=(this.energy*100).toFixed(1)+'%';
            }

            updateBot(dt){
              this.ai.timer-=dt;
              if(this.ai.timer<=0||!this.ai.target){
                this.ai.timer=rand(.18,.42);
                let target=null,best=-1e9;

                const foodBuckets=neighborBuckets(foodGrid,this.x,this.y,FOOD_CELL,FOOD_CELLS,3);
                for(const bucket of foodBuckets){
                  for(const f of bucket){
                    if(!f.alive)continue;
                    const d=distance(this.x,this.y,f.x,f.y);
                    if(d>950)continue;
                    const desirability=(f.loot?560:120)+f.v*65-d;
                    if(desirability>best){
                      best=desirability;
                      target={x:f.x,y:f.y,type:'food'};
                    }
                  }
                }

                let danger=null,dangerDist=9999;
                const bodyBuckets=neighborBuckets(bodyGrid,this.x,this.y,BODY_CELL,BODY_CELLS,1);
                for(const bucket of bodyBuckets){
                  for(const item of bucket){
                    if(item.owner===this||!item.owner.alive)continue;
                    const d=distance(this.x,this.y,item.x,item.y);
                    if(d<dangerDist){dangerDist=d;danger=item}
                  }
                }

                if(danger&&dangerDist<115){
                  const dx=-delta(this.x,danger.x),dy=-delta(this.y,danger.y);
                  target={x:wrap(this.x+dx*5),y:wrap(this.y+dy*5),type:'avoid'};
                }

                if(!target){
                  target={
                    x:wrap(this.x+Math.cos(this.angle+rand(-1.0,1.0))*600),
                    y:wrap(this.y+Math.sin(this.angle+rand(-1.0,1.0))*600),
                    type:'wander'
                  };
                }
                this.ai.target=target;
              }

              const p=this.ai.target;
              const targetAngle=Math.atan2(delta(this.y,p.y),delta(this.x,p.x));
              this.angle+=angleDiff(this.angle,targetAngle)*Math.min(1,this.turnRate*dt);

              const useBoost=p.type==='food'&&this.ai.bravery>.55&&this.energy>.28&&distance(this.x,this.y,p.x,p.y)>160;
              if(useBoost){
                this.speed=BOOST_SPEED*.84;
                this.energy=Math.max(0,this.energy-dt*.13);
              }else{
                this.speed=BASE_SPEED*this.cruise;
                this.energy=Math.min(1,this.energy+dt*.09);
              }
            }

            eatNearby(){
              const buckets=neighborBuckets(foodGrid,this.x,this.y,FOOD_CELL,FOOD_CELLS,1);
              for(const bucket of buckets){
                for(const f of bucket){
                  if(!f.alive)continue;
                  if(distance(this.x,this.y,f.x,f.y)<this.radius+f.r+4){
                    f.alive=false;
                    this.grow(f.v);
                  }
                }
              }
            }
          }

          const player=new Snake('YOU','#55e9ff',true);
          snakes.push(player);
          for(let i=0;i<BOTS;i++){
            const base=BOT_NAMES[i%BOT_NAMES.length];
            const suffix=i>=BOT_NAMES.length?String(i-BOT_NAMES.length+2):'';
            snakes.push(new Snake(base+suffix,BOT_COLORS[i%BOT_COLORS.length],false));
          }

          rebuildFoodGrid();
          rebuildBodyGrid();

          function collisionCheck(){
            for(const attacker of snakes){
              if(!attacker.alive)continue;
              const buckets=neighborBuckets(bodyGrid,attacker.x,attacker.y,BODY_CELL,BODY_CELLS,1);
              outer:
              for(const bucket of buckets){
                for(const item of bucket){
                  if(!attacker.alive)break outer;
                  if(item.owner===attacker||!item.owner.alive)continue;
                  if(distance(attacker.x,attacker.y,item.x,item.y)<attacker.radius+item.r-1.3){
                    attacker.die();
                    break outer;
                  }
                }
              }
            }

            for(let i=0;i<snakes.length;i++){
              const a=snakes[i];
              if(!a.alive)continue;
              for(let j=i+1;j<snakes.length;j++){
                const b=snakes[j];
                if(!b.alive)continue;
                if(distance(a.x,a.y,b.x,b.y)<a.radius+b.radius-3){
                  a.die();b.die();
                }
              }
            }
          }

          function updateFood(dt){
            for(const f of foods){
              if(!f.alive)continue;
              if(f.loot){
                f.ttl-=dt;
                if(f.ttl<=0)f.alive=false;
              }
            }
            foods=foods.filter(f=>f.alive);
            while(foods.length<FOOD_TARGET)spawnFood();
            if(foods.length>MAX_FOOD){
              let remove=foods.length-MAX_FOOD;
              for(let i=0;i<foods.length&&remove>0;i++){
                if(!foods[i].loot){
                  foods[i].alive=false;
                  remove--;
                }
              }
              foods=foods.filter(f=>f.alive);
            }
          }

          function screenPos(wx,wy,zoom){
            return{
              x:W/2+delta(player.x,wx)*zoom,
              y:H/2+delta(player.y,wy)*zoom
            };
          }

          function currentZoom(){
            return clamp(1.02-Math.log(1+player.length/22)*.075,.70,1.02);
          }

          function drawBackground(zoom){
            const gradient=ctx.createRadialGradient(W*.5,H*.45,30,W*.5,H*.5,Math.max(W,H)*.74);
            gradient.addColorStop(0,'#13314c');
            gradient.addColorStop(.58,'#091c2e');
            gradient.addColorStop(1,'#04101b');
            ctx.fillStyle=gradient;
            ctx.fillRect(0,0,W,H);

            const grid=115*zoom;
            const worldGX=(player.x%115)*zoom;
            const worldGY=(player.y%115)*zoom;
            const sx=W/2-worldGX;
            const sy=H/2-worldGY;
            ctx.beginPath();
            for(let gx=sx-grid;gx<W+grid;gx+=grid){ctx.moveTo(gx,0);ctx.lineTo(gx,H)}
            for(let gy=sy-grid;gy<H+grid;gy+=grid){ctx.moveTo(0,gy);ctx.lineTo(W,gy)}
            ctx.strokeStyle='rgba(255,255,255,.034)';
            ctx.lineWidth=1;
            ctx.stroke();
          }

          function drawFood(time,zoom){
            for(const f of foods){
              if(!f.alive)continue;
              const p=screenPos(f.x,f.y,zoom);
              if(p.x<-25||p.x>W+25||p.y<-25||p.y>H+25)continue;
              const pulse=f.loot?1+Math.sin(time*5+f.phase)*.14:1;
              ctx.save();
              if(f.loot){ctx.shadowColor=f.color;ctx.shadowBlur=15}
              ctx.fillStyle=f.color;
              ctx.beginPath();
              ctx.arc(p.x,p.y,Math.max(2.4,f.r*zoom*pulse),0,Math.PI*2);
              ctx.fill();
              ctx.restore();
            }
          }

          function drawSnake(s,zoom){
            if(!s.alive)return;
            for(let i=s.segments.length-1;i>=0;i--){
              const seg=s.segments[i];
              const p=screenPos(seg.x,seg.y,zoom);
              if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40)continue;
              const r=Math.max(3.5,s.radius*(1-(i/Math.max(1,s.segments.length))*.25)*zoom);
              ctx.fillStyle=s.color;
              ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
              if(i%4===0&&r>4){
                ctx.fillStyle='rgba(255,255,255,.08)';
                ctx.beginPath();ctx.arc(p.x-r*.22,p.y-r*.24,r*.35,0,Math.PI*2);ctx.fill();
              }
            }

            const h=screenPos(s.x,s.y,zoom);
            const hr=Math.max(5,s.radius*zoom+1);
            ctx.save();
            ctx.shadowColor=s.color;ctx.shadowBlur=12;
            ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(h.x,h.y,hr,0,Math.PI*2);ctx.fill();
            ctx.shadowBlur=0;

            const fx=Math.cos(s.angle),fy=Math.sin(s.angle),px=-fy,py=fx;
            const eyeOffset=Math.max(2.8,4*zoom);
            const eyeForward=Math.max(3.2,4.3*zoom);
            const eyeR=Math.max(1.7,2.7*zoom);
            ctx.fillStyle='#fff';
            for(const side of [-1,1]){
              ctx.beginPath();
              ctx.arc(h.x+fx*eyeForward+px*eyeOffset*side,h.y+fy*eyeForward+py*eyeOffset*side,eyeR,0,Math.PI*2);
              ctx.fill();
            }
            ctx.restore();

            if(!s.isPlayer){
              ctx.font='600 '+Math.max(8,10*zoom)+'px Arial';
              ctx.textAlign='center';
              ctx.fillStyle='rgba(238,249,255,.82)';
              ctx.fillText(s.name,h.x,h.y-17*zoom);
            }
          }

          function drawRadar(){
            const w=radar.width,h=radar.height;
            const cx=w/2,cy=h/2;
            const radarRange=1500;
            const scale=(Math.min(w,h)*.46)/radarRange;

            rctx.clearRect(0,0,w,h);

            const bg=rctx.createRadialGradient(cx,cy,4,cx,cy,Math.min(w,h)*.7);
            bg.addColorStop(0,'#102d43');
            bg.addColorStop(1,'#05111d');
            rctx.fillStyle=bg;
            rctx.fillRect(0,0,w,h);

            // Moving world grid: the map scrolls beneath the player as the player moves.
            const worldGrid=300;
            const gridPx=worldGrid*scale;
            const offsetX=((player.x%worldGrid)+worldGrid)%worldGrid*scale;
            const offsetY=((player.y%worldGrid)+worldGrid)%worldGrid*scale;

            rctx.beginPath();
            for(let gx=cx-offsetX-gridPx;gx<w+gridPx;gx+=gridPx){
              rctx.moveTo(gx,0);rctx.lineTo(gx,h);
            }
            for(let gy=cy-offsetY-gridPx;gy<h+gridPx;gy+=gridPx){
              rctx.moveTo(0,gy);rctx.lineTo(w,gy);
            }
            rctx.strokeStyle='rgba(119,214,255,.10)';
            rctx.lineWidth=1;
            rctx.stroke();

            // Local radar rings.
            rctx.beginPath();
            rctx.arc(cx,cy,Math.min(w,h)*.23,0,Math.PI*2);
            rctx.arc(cx,cy,Math.min(w,h)*.45,0,Math.PI*2);
            rctx.strokeStyle='rgba(255,255,255,.08)';
            rctx.stroke();

            // Nearby food as faint tiny dots so the map feels alive.
            const foodBuckets=neighborBuckets(foodGrid,player.x,player.y,FOOD_CELL,FOOD_CELLS,8);
            let foodDrawn=0;
            rctx.fillStyle='rgba(255,215,92,.30)';
            for(const bucket of foodBuckets){
              for(const f of bucket){
                if(!f.alive||foodDrawn>=80)continue;
                const dx=delta(player.x,f.x);
                const dy=delta(player.y,f.y);
                if(Math.abs(dx)>radarRange||Math.abs(dy)>radarRange)continue;
                const rx=cx+dx*scale,ry=cy+dy*scale;
                if(rx<2||rx>w-2||ry<2||ry>h-2)continue;
                rctx.fillRect(rx,ry,1,1);
                foodDrawn++;
              }
            }

            // AI snakes move relative to the player. Off-screen AI get edge indicators.
            for(const s of snakes){
              if(!s.alive||s===player)continue;
              const dx=delta(player.x,s.x);
              const dy=delta(player.y,s.y);
              const d=Math.hypot(dx,dy);

              if(d<=radarRange){
                const rx=cx+dx*scale;
                const ry=cy+dy*scale;

                // Short body trail so each snake is clearly visible as a snake, not just a dot.
                rctx.strokeStyle=s.color;
                rctx.lineWidth=1.4;
                rctx.beginPath();
                let startedTrail=false;
                for(let i=0;i<s.segments.length;i+=Math.max(2,Math.ceil(s.segments.length/10))){
                  const seg=s.segments[i];
                  const sdx=delta(player.x,seg.x);
                  const sdy=delta(player.y,seg.y);
                  if(Math.abs(sdx)>radarRange||Math.abs(sdy)>radarRange)continue;
                  const sx=cx+sdx*scale,sy=cy+sdy*scale;
                  if(!startedTrail){rctx.moveTo(sx,sy);startedTrail=true}
                  else rctx.lineTo(sx,sy);
                }
                if(startedTrail)rctx.stroke();

                rctx.fillStyle=s.color;
                rctx.beginPath();
                rctx.arc(rx,ry,2.4,0,Math.PI*2);
                rctx.fill();
              }else{
                const ang=Math.atan2(dy,dx);
                const er=Math.min(w,h)*.43;
                const ex=cx+Math.cos(ang)*er;
                const ey=cy+Math.sin(ang)*er;
                rctx.fillStyle=s.color;
                rctx.beginPath();
                rctx.arc(ex,ey,1.4,0,Math.PI*2);
                rctx.fill();
              }
            }

            // Player is always centered, with a direction arrow and a small body trail.
            rctx.strokeStyle='#ffffff';
            rctx.lineWidth=2;
            rctx.beginPath();
            let playerTrailStarted=false;
            for(let i=0;i<player.segments.length;i+=Math.max(1,Math.ceil(player.segments.length/12))){
              const seg=player.segments[i];
              const dx=delta(player.x,seg.x);
              const dy=delta(player.y,seg.y);
              const px=cx+dx*scale,py=cy+dy*scale;
              if(!playerTrailStarted){rctx.moveTo(px,py);playerTrailStarted=true}
              else rctx.lineTo(px,py);
            }
            if(playerTrailStarted)rctx.stroke();

            rctx.save();
            rctx.translate(cx,cy);
            rctx.rotate(player.angle);
            rctx.fillStyle='#ffffff';
            rctx.beginPath();
            rctx.moveTo(5,0);
            rctx.lineTo(-3.5,-3);
            rctx.lineTo(-2,0);
            rctx.lineTo(-3.5,3);
            rctx.closePath();
            rctx.fill();
            rctx.restore();

            rctx.strokeStyle='rgba(255,255,255,.24)';
            rctx.lineWidth=1.5;
            rctx.strokeRect(.75,.75,w-1.5,h-1.5);
          }

          function updateHud(){
            const alive=snakes.filter(s=>s.alive).sort((a,b)=>(b.score+b.length*2)-(a.score+a.length*2));
            $('score').textContent=Math.floor(player.score);
            $('length').textContent=Math.floor(player.length);
            $('rank').textContent=player.alive?(alive.indexOf(player)+1)+'/'+alive.length:'-';
            $('list').innerHTML=alive.slice(0,6).map(s=>{
              const style=s===player?' style="color:#ffd45e;font-weight:900"':'';
              return '<li'+style+'>'+s.name+' — '+Math.floor(s.score+s.length*2)+'</li>';
            }).join('');
          }

          function resetPlayer(){
            player.score=0;
            player.respawn(false);
            $('dead').style.display='none';
            paused=false;
            boost=false;
            $('boostBtn').classList.remove('active');
            joystick.active=false;joystick.pointerId=null;joystick.x=0;joystick.y=0;
            joystick.lastAngle=player.angle;
            $('joystick').classList.remove('active');
            $('stick').style.transform='translate(-50%,-50%)';
            pointer.x=W*.7;pointer.y=H*.5;pointer.lastMove=0;
          }

          function setPaused(value){
            if(!started)return;
            paused=value;
            if(paused){
              boost=false;
              boostPointerId=null;
              $('boostBtn').classList.remove('active');
              if(joystick.active&&Math.hypot(joystick.x,joystick.y)>.12){
                joystick.lastAngle=Math.atan2(joystick.y,joystick.x);
              }
              joystick.active=false;
              joystick.pointerId=null;
              joystick.x=0;joystick.y=0;
              $('joystick').classList.remove('active');
              $('stick').style.transform='translate(-50%,-50%)';
            }
            $('pause').style.display=paused?'flex':'none';
          }

          window.snakeAppPause=()=>{
            if(started&&player.alive)setPaused(true);
          };
          window.snakeAppResume=()=>{
            last=performance.now();
            if(started&&player.alive&&paused)$('pause').style.display='flex';
          };

          document.addEventListener('visibilitychange',()=>{
            if(document.hidden&&started&&player.alive)setPaused(true);
            else if(!document.hidden&&started&&player.alive&&paused)$('pause').style.display='flex';
            last=performance.now();
          });

          function frame(now){
            const dt=Math.min(.033,Math.max(0,(now-last)/1000));
            last=now;

            if(started&&!paused){
              rebuildFoodGrid();
              rebuildBodyGrid();

              for(const s of snakes)s.update(dt);

              rebuildBodyGrid();
              collisionCheck();
              updateFood(dt);
              rebuildFoodGrid();
            }

            const zoom=currentZoom();
            drawBackground(zoom);
            drawFood(now/1000,zoom);
            const order=snakes.slice().sort((a,b)=>a.length-b.length);
            for(const s of order)drawSnake(s,zoom);
            drawRadar();
            updateHud();

            requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);

          function steerFromEvent(e){
            pointer.x=e.clientX;
            pointer.y=e.clientY;
            pointer.lastMove=performance.now();
          }

          canvas.addEventListener('mousemove',steerFromEvent);

          const joy=$('joystick');
          const stick=$('stick');

          function updateJoystick(e){
            const rect=joy.getBoundingClientRect();
            const cx=rect.left+rect.width/2;
            const cy=rect.top+rect.height/2;
            let dx=e.clientX-cx;
            let dy=e.clientY-cy;
            const max=Math.min(rect.width,rect.height)*.34;
            const dist=Math.hypot(dx,dy);
            if(dist>max){
              dx=dx/dist*max;
              dy=dy/dist*max;
            }
            joystick.x=dx/max;
            joystick.y=dy/max;
            stick.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
          }

          function releaseJoystick(e){
            if(!joystick.active)return;
            if(e&&joystick.pointerId!==null&&e.pointerId!==joystick.pointerId)return;
            if(Math.hypot(joystick.x,joystick.y)>.12){
              joystick.lastAngle=Math.atan2(joystick.y,joystick.x);
            }
            joystick.active=false;
            joystick.pointerId=null;
            joystick.x=0;joystick.y=0;
            joy.classList.remove('active');
            stick.style.transform='translate(-50%,-50%)';
          }

          joy.addEventListener('pointerdown',e=>{
            joystick.active=true;
            joystick.pointerId=e.pointerId;
            joy.classList.add('active');
            joy.setPointerCapture&&joy.setPointerCapture(e.pointerId);
            updateJoystick(e);
            e.preventDefault();
            e.stopPropagation();
          });

          joy.addEventListener('pointermove',e=>{
            if(!joystick.active||e.pointerId!==joystick.pointerId)return;
            updateJoystick(e);
            e.preventDefault();
          });

          joy.addEventListener('pointerup',releaseJoystick);
          joy.addEventListener('pointercancel',releaseJoystick);
          joy.addEventListener('lostpointercapture',releaseJoystick);

          let boostPointerId=null;
          $('boostBtn').addEventListener('pointerdown',e=>{
            boost=true;
            boostPointerId=e.pointerId;
            $('boostBtn').classList.add('active');
            $('boostBtn').setPointerCapture&&$('boostBtn').setPointerCapture(e.pointerId);
            e.preventDefault();
            e.stopPropagation();
          });
          function releaseBoost(e){
            if(boostPointerId!==null&&e&&e.pointerId!==boostPointerId)return;
            boost=false;
            boostPointerId=null;
            $('boostBtn').classList.remove('active');
          }
          $('boostBtn').addEventListener('pointerup',releaseBoost);
          $('boostBtn').addEventListener('pointercancel',releaseBoost);
          $('boostBtn').addEventListener('lostpointercapture',releaseBoost);

          $('play').onclick=()=>{
            joystick.lastAngle=player.angle;
            pointer.lastMove=0;
            started=true;
            paused=false;
            $('start').style.display='none';
            last=performance.now();
          };
          $('again').onclick=resetPlayer;
          $('resume').onclick=()=>{
            paused=false;
            $('pause').style.display='none';
            last=performance.now();
          };

          })();
          </script>
          </body>
          </html>
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Snake-Arena-IO-better-v2.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Arena-IO-Better-v2.4-APK
          path: Snake-Arena-IO-better-v2.4.apk
          if-no-files-found: error
